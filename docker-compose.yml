version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: civicsphere-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: civicsphere_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: civicsphere-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/civicsphere_db
      DB_USERNAME: root
      DB_PASSWORD: password
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
volumes:
  db_data:

