<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Registration - CivicSphere</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    .auth-card {
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 520px;
      padding: 2.5rem;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div style="text-align:center; margin-bottom:1.75rem;">
      <div style="font-size:2.2rem; margin-bottom:0.4rem;">🏛️</div>
      <h2 style="font-size:1.6rem; color:var(--primary);">Citizen Registration</h2>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.3rem;">Join CivicSphere to report civic issues and track resolutions</p>
    </div>

    <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="regFullName">Full Name *</label>
        <input type="text" id="regFullName" class="form-control" placeholder="e.g. Ramesh Kumar" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address *</label>
          <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regPhone">Phone Number *</label>
          <input type="tel" id="regPhone" class="form-control" placeholder="10-digit mobile" required pattern="[0-9]{10,}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="regPassword">Password *</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Min. 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password *</label>
          <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regAddress">Residential Address *</label>
        <textarea id="regAddress" class="form-control" rows="2" placeholder="Colony / Flat, Street, Area, City" required></textarea>
      </div>

      <div id="registerError" style="display:none; color:#dc2626; background:#fee2e2; padding:0.65rem; border-radius:6px; font-size:0.85rem; margin-bottom:1rem;"></div>

      <button type="submit" id="btnRegisterSubmit" class="btn btn-primary" style="width:100%; padding:0.75rem;">Create Account</button>
    </form>

    <div style="text-align:center; margin-top:1.25rem; font-size:0.88rem; color:var(--text-muted);">
      Already registered? <a href="/login.html" style="font-weight:600;">Sign In</a>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnRegisterSubmit');
      const errBox = document.getElementById('registerError');

      const fullName = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const address = document.getElementById('regAddress').value.trim();

      if (password !== confirmPassword) {
        errBox.textContent = 'Passwords do not match.';
        errBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating Account...';
      errBox.style.display = 'none';

      try {
        await Auth.register({ fullName, email, phone, password, confirmPassword, address });
        showToast('Registration successful! Redirecting to dashboard...', 'success');
        setTimeout(() => {
          window.location.href = '/citizen/dashboard.html';
        }, 1200);
      } catch (err) {
        errBox.textContent = err.message || 'Registration failed.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
